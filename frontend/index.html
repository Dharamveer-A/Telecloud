<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeleCloud</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        var saved = localStorage.getItem('telecloud_theme');
        if (saved === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }

        // Global fallback to recover from stale caches or failed script loads
        window.__tc_mounted = false;
        window.addEventListener('error', function(e) {
          if (!window.__tc_mounted && (e.message || '').includes('Loading chunk') || (e.target && e.target.tagName === 'SCRIPT')) {
            console.warn('Script loading error detected before mount:', e);
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-ink text-paper font-body">
    <div id="root">
      <div id="initial-splash" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0c0e14; color: #f1f5f9; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px;">
        <svg style="width: 56px; height: 56px; margin-bottom: 16px; filter: drop-shadow(0 4px 14px rgba(45,212,191,0.35));" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="splash-cloud" x1="8" y1="12" x2="42" y2="40" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#2dd4bf" />
              <stop offset="45%" stop-color="#06b6d4" />
              <stop offset="100%" stop-color="#0284c7" />
            </linearGradient>
            <linearGradient id="splash-plane" x1="14" y1="11" x2="39" y2="35" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="55%" stop-color="#e0f2fe" />
              <stop offset="100%" stop-color="#bae6fd" />
            </linearGradient>
            <linearGradient id="splash-plane-shade" x1="22" y1="21" x2="38" y2="35" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#0891b2" />
              <stop offset="100%" stop-color="#0369a1" />
            </linearGradient>
          </defs>
          <path d="M16.5 37C12.3 37 9 33.6 9 29.5C9 25.6 12 22.3 15.9 22C17.4 16.3 22.5 12 28.5 12C35.7 12 41.5 17.5 41.9 24.6C44.2 25.9 45.5 28.4 45.5 31.2C45.5 35 42.4 37 38.6 37H16.5Z" fill="url(#splash-cloud)" />
          <path d="M13.5 23.5L39.5 11.5L24 26.5L13.5 23.5Z" fill="url(#splash-plane)" />
          <path d="M24 26.5L39.5 11.5L29 35.5L24 26.5Z" fill="url(#splash-plane-shade)" opacity="0.5" />
          <path d="M24 26.5L26.5 31L28 27.2L24 26.5Z" fill="url(#splash-plane-shade)" opacity="0.85" />
        </svg>
        <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.025em; margin-bottom: 8px;">
          <span>Tele</span><span style="color: #2dd4bf;">Cloud</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #8892b0; margin-top: 4px;">
          <div style="width: 6px; height: 6px; border-radius: 50%; background-color: #2dd4bf; animation: ping 1.2s cubic-bezier(0, 0, 0.2, 1) infinite;"></div>
          <span>Connecting...</span>
        </div>
        <style>
          @keyframes ping {
            75%, 100% { transform: scale(2); opacity: 0; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // If the app doesn't mount within 6 seconds, provide an instant recovery button
      setTimeout(function() {
        var splash = document.getElementById('initial-splash');
        if (splash) {
          splash.innerHTML = `
            <svg style="width: 48px; height: 48px; margin-bottom: 12px; color: #2dd4bf;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <div style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">Update Available or Connection Slow</div>
            <p style="font-size: 13px; color: #8892b0; max-width: 320px; margin-bottom: 16px; line-height: 1.5;">
              A newer version of TeleCloud may have been deployed. Click below to load the fresh version.
            </p>
            <button onclick="window.__hardReload()" style="background-color: #2dd4bf; color: #0c0e14; border: none; border-radius: 10px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;">
              Reload Fresh Version
            </button>
          `;
        }
      }, 6000);

      window.__hardReload = async function() {
        try {
          if ('caches' in window) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function(k) { return caches.delete(k); }));
          }
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            for (var i = 0; i < regs.length; i++) {
              await regs[i].unregister();
            }
          }
        } catch (e) {}
        window.location.reload(true);
      };
    </script>
  </body>
</html>
